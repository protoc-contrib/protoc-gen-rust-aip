// Fixture for the AIP-203 clearing walks and checks, and for MUTABLE_PATHS,
// which reads the same annotations the other way round.
//
// Covers every shape the walk has to reach: a scalar, a message, a repeated
// message, a map with message values, a nested message that is itself clean
// but contains something that is not, and a oneof with an output-only member.
syntax = "proto3";

package example.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

message Shipment {
  // A resource, so MUTABLE_PATHS is emitted for it.
  option (google.api.resource) = {
    type: "example.com/Shipment"
    pattern: "shipments/{shipment}"
  };

  // The name selects the target of an update rather than being part of it, so
  // IDENTIFIER is not writable -- the same answer OUTPUT_ONLY gets, by a
  // different route.
  string name = 11 [(google.api.field_behavior) = IDENTIFIER];

  // Client-settable.
  string reference = 1;

  // Server-owned, of every shape.
  string tracking_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string audit_log = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 revision = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Not output-only itself, but holds fields that are: the walk must descend.
  Carrier carrier = 6;
  repeated Parcel parcels = 7;
  map<string, Parcel> parcels_by_code = 8;

  // Nothing output-only anywhere beneath it; the walk must not descend.
  Address origin = 9;

  // A field carrying more than one behavior still counts as output-only.
  string etag = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

message Carrier {
  string name = 1;
  string scac = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Parcel {
  string label = 1;
  double billed_weight = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Two levels down, to prove the walk is recursive rather than one-deep.
  Carrier carrier = 3;
}

// No output-only fields at any depth, so no walk is emitted for it at all.
message Address {
  string line1 = 1;
  string city = 2;
}

// A oneof with one output-only member.
message Event {
  string id = 1;
  oneof detail {
    string note = 2;
    string server_trace = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    Carrier handoff = 4;
  }
}

// A resource with one writable field of every remaining shape, for
// `implied_update_mask`: explicit and implicit presence, a oneof, an enum, a
// float, and an IMMUTABLE field that is never implied however it is set.
message Meter {
  option (google.api.resource) = {
    type: "example.com/Meter"
    pattern: "meters/{meter}"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  optional int32 threshold = 2;
  double level = 3;
  Unit unit = 4;
  bool active = 5;
  bytes calibration = 6;
  oneof reading {
    string label = 7;
    int64 count = 8;
  }
  string serial = 9 [(google.api.field_behavior) = IMMUTABLE];
}

enum Unit {
  UNIT_UNSPECIFIED = 0;
  UNIT_LITRE = 1;
}

// A resource for `validate_required_fields`, `clear_input_only` and the
// UNORDERED_LIST comparison in `validate_immutable`: REQUIRED fields of
// every shape the check reads, nested ones it has to descend into, and one it
// must not.
message Order {
  option (google.api.resource) = {
    type: "example.com/Order"
    pattern: "orders/{order}"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Implicit presence: unset is the zero value, so a REQUIRED bool must be
  // true.
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  bool confirmed = 3 [(google.api.field_behavior) = REQUIRED];
  // Explicit presence: set to zero still counts.
  optional int32 quantity = 4 [(google.api.field_behavior) = REQUIRED];

  // A REQUIRED message, with REQUIRED fields of its own and two levels down.
  Destination destination = 5 [(google.api.field_behavior) = REQUIRED];
  // Not REQUIRED itself; its own REQUIRED fields apply only when it is set.
  Destination billing = 6;
  // Repeated: present when not empty, and never descended into.
  repeated Destination stops = 7 [(google.api.field_behavior) = REQUIRED];

  // A oneof member that is a message is descended into when it is the one set.
  oneof payment {
    string card = 8;
    Voucher voucher = 9;
  }

  // A message that contains itself, entered once per path.
  Node root = 10;

  // IMMUTABLE lists: the service keeps one's order and not the other's.
  repeated string legs = 11 [(google.api.field_behavior) = IMMUTABLE];
  repeated string tags = 12 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = UNORDERED_LIST
  ];

  // Accepted on input, never returned.
  string coupon = 13 [(google.api.field_behavior) = INPUT_ONLY];
}

message Destination {
  string city = 1 [(google.api.field_behavior) = REQUIRED];
  string line2 = 2;
  Geo geo = 3;
  // INPUT_ONLY beneath the resource, so clear_input_only has to descend.
  string access_code = 4 [(google.api.field_behavior) = INPUT_ONLY];
}

message Geo {
  double latitude = 1 [(google.api.field_behavior) = REQUIRED];
}

message Voucher {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message Node {
  string label = 1 [(google.api.field_behavior) = REQUIRED];
  Node child = 2;
}

// AIP standard method requests for `validate_required`, `imply_resource_name`
// and `imply_update_mask`, generated on a service's create, update and batch
// requests -- and on the entries of a batch -- and on nothing else.
service Orders {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc CreateLine(CreateLineRequest) returns (Line);
  rpc UpdateOrder(UpdateOrderRequest) returns (Order);
  rpc BatchCreateOrders(BatchCreateOrdersRequest) returns (BatchOrdersResponse);
  rpc BatchUpdateOrders(BatchUpdateOrdersRequest) returns (BatchOrdersResponse);
}

// A create: a resource field and no update_mask. Its `order_id` names the
// order under its top-level pattern.
message CreateOrderRequest {
  string parent = 1;
  Order order = 2;
  string order_id = 3;
}

// A resource under a nested pattern, whose own `parent` the server copies from
// the create request.
message Line {
  option (google.api.resource) = {
    type: "example.com/Line"
    pattern: "orders/{order}/lines/{line}"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string parent = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string sku = 3 [(google.api.field_behavior) = REQUIRED];
}

// A create under a parent: the line is named `<parent>/lines/<line_id>`.
message CreateLineRequest {
  string parent = 1;
  string line_id = 2;
  Line line = 3;
}

// An update: a resource field and an update_mask.
message UpdateOrderRequest {
  Order order = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message BatchCreateOrdersRequest {
  repeated CreateOrderRequest requests = 1;
}

message BatchUpdateOrdersRequest {
  repeated UpdateOrderRequest requests = 1;
}

message BatchOrdersResponse {
  repeated Order orders = 1;
}

// Holds a resource but is no method's request: it gets no request-level items.
message OrderEnvelope {
  Order order = 1;
}
