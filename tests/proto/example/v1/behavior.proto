// Fixture for the AIP-203 OUTPUT_ONLY clearing walk, and for MUTABLE_PATHS,
// which reads the same annotations the other way round.
//
// Covers every shape the walk has to reach: a scalar, a message, a repeated
// message, a map with message values, a nested message that is itself clean
// but contains something that is not, and a oneof with an output-only member.
syntax = "proto3";

package example.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

message Shipment {
  // A resource, so MUTABLE_PATHS is emitted for it.
  option (google.api.resource) = {
    type: "example.com/Shipment"
    pattern: "shipments/{shipment}"
  };

  // The name selects the target of an update rather than being part of it, so
  // IDENTIFIER is not writable -- the same answer OUTPUT_ONLY gets, by a
  // different route.
  string name = 11 [(google.api.field_behavior) = IDENTIFIER];

  // Client-settable.
  string reference = 1;

  // Server-owned, of every shape.
  string tracking_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string audit_log = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 revision = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Not output-only itself, but holds fields that are: the walk must descend.
  Carrier carrier = 6;
  repeated Parcel parcels = 7;
  map<string, Parcel> parcels_by_code = 8;

  // Nothing output-only anywhere beneath it; the walk must not descend.
  Address origin = 9;

  // A field carrying more than one behavior still counts as output-only.
  string etag = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

message Carrier {
  string name = 1;
  string scac = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Parcel {
  string label = 1;
  double billed_weight = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Two levels down, to prove the walk is recursive rather than one-deep.
  Carrier carrier = 3;
}

// No output-only fields at any depth, so no walk is emitted for it at all.
message Address {
  string line1 = 1;
  string city = 2;
}

// A oneof with one output-only member.
message Event {
  string id = 1;
  oneof detail {
    string note = 2;
    string server_trace = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    Carrier handoff = 4;
  }
}

// A resource with one writable field of every remaining shape, for
// `implied_update_mask`: explicit and implicit presence, a oneof, an enum, a
// float, and an IMMUTABLE field that is never implied however it is set.
message Meter {
  option (google.api.resource) = {
    type: "example.com/Meter"
    pattern: "meters/{meter}"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  optional int32 threshold = 2;
  double level = 3;
  Unit unit = 4;
  bool active = 5;
  bytes calibration = 6;
  oneof reading {
    string label = 7;
    int64 count = 8;
  }
  string serial = 9 [(google.api.field_behavior) = IMMUTABLE];
}

enum Unit {
  UNIT_UNSPECIFIED = 0;
  UNIT_LITRE = 1;
}
