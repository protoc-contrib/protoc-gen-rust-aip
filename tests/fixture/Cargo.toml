[package]
name = "aip-fixture"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiles the test schema with both buffa and this plugin, so the generated code is type-checked and exercised rather than only diffed against a golden file."

# The same lints the plugin holds itself to. Generated code is included into
# this crate, so a lint it trips is a lint a consumer would trip -- and several
# consumers in this ecosystem deny pedantic at the workspace level.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
buffa = "0.9.2"
# google.protobuf.Timestamp, used by the field-behavior fixture.
buffa-types = "0.9.2"
# From git, not crates.io: aip-rs is unreleased. Renamed to `aip`, because that
# is what the generated code says -- the crate is published as `aip-rs` only
# because `aip` was taken.
#
# A sibling checkout would work here too and is quicker to iterate against, but
# it makes a standalone clone of this repo unbuildable, which is exactly what
# this crate exists to prove is not the case.
aip = { package = "aip-rs", git = "https://github.com/protoc-contrib/aip-rs" }
# Only a schema that annotates an ID as UUID4 needs this; the plugin names the
# crate in generated code exactly when it types a segment as one. `v4` because
# the AIP-133 create-ID accessor mints one when the caller proposes none.
uuid = { version = "1", features = ["v4"] }
# The AIP-134 mask check reports a protovalidate violation, so a schema with an
# update request needs the runtime. Only that -- not the codegen plugin: this
# crate emits the check itself and borrows protovalidate's error shape so a bad
# mask is indistinguishable from any other rule violation at the boundary.
protovalidate-buffa = { version = "0.7", default-features = false }
# The filter dimension is plain CEL. Only a schema with a List request needs
# this; the plugin names the crate exactly when it emits a filter parser.
cel = { version = "0.14", default-features = false }

[build-dependencies]
# The plugin as a library rather than as a `protoc` plugin binary: a build
# script cannot depend on a binary from the same build, and going through the
# library exercises the same two passes the binary does.
protoc-gen-rust-aip = { path = "../.." }
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-codegen = "0.9.2"
anyhow = "1"
