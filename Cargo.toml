[workspace]
members = ["fixture"]

[package]
name = "protoc-gen-rust-aip"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "protoc plugin that emits Rust helpers for Google AIP-shaped APIs: resource names, List query parsing and the OUTPUT_ONLY clearing walk."
repository = "https://github.com/protoc-contrib/protoc-gen-rust-aip"
keywords = ["aip", "protobuf", "buffa", "grpc", "codegen"]
categories = ["development-tools"]

[[bin]]
name = "protoc-gen-rust-aip"
path = "src/main.rs"

[lib]
name = "protoc_gen_rust_aip"
path = "src/lib.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# The descriptor and plugin-protocol types, and the ident-naming rules the
# generated code has to agree with. Pinned to the same minor as the buffa
# codegen whose output this extends -- a message field named by a different
# rule than buffa used is a compile error in the consumer, not here.
buffa = "0.9.2"
buffa-codegen = "0.9.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"
anyhow = "1"

[build-dependencies]
buffa-build = "0.9.2"
