[workspace]
members = ["tests/fixture"]

[package]
name = "protoc-gen-rust-aip"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "protoc plugin that emits Rust helpers for Google AIP-shaped APIs: typed resource names, create IDs, update-mask paths, the REQUIRED and IMMUTABLE checks, the OUTPUT_ONLY and INPUT_ONLY clearing walks and the AIP-160 filter environment."
repository = "https://github.com/protoc-contrib/protoc-gen-rust-aip"
homepage = "https://github.com/protoc-contrib/protoc-gen-rust-aip"
keywords = ["aip", "protobuf", "buffa", "grpc", "codegen"]
categories = ["development-tools"]
# What `cargo install` builds from: the plugin, with the google/api annotation
# types generated and committed under src/generated, so it needs no protoc. The
# vendored protos, the fixture, its test schema, CI and Nix are this
# repository's, not the crate's.
include = ["src/**", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "protoc-gen-rust-aip"
path = "src/main.rs"

[lib]
name = "protoc_gen_rust_aip"
path = "src/lib.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# The descriptor and plugin-protocol types, and the ident-naming rules the
# generated code has to agree with. Pinned to the same minor as the buffa
# codegen whose output this extends -- a message field named by a different
# rule than buffa used is a compile error in the consumer, not here.
buffa = "0.9.2"
buffa-codegen = "0.9.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"
anyhow = "1"
# The runtime the generated code calls into, used here for one thing: compiling
# each pattern the way the generated code will at startup, so a pattern the
# runtime rejects fails `buf generate` instead of panicking in a consumer.
# The git source is temporary, for `FieldPath` and the request-level
# `FieldBehavior` items (protoc-contrib/aip-rs#15, not yet released) the
# fixture's generated code implements: it keeps the workspace on one aip-rs.
# Publishing drops it and uses the version, which has everything the plugin
# itself calls. Back to the version alone once released.
aip = { package = "aip-rs", version = "0.2", git = "https://github.com/protoc-contrib/aip-rs", rev = "13e1abf3d7c60a2c0ca5d19a53b5c95ee556eb80" }

[dev-dependencies]
# Regenerates src/generated, to check it is current; see tests/generated.rs.
buffa-build = "0.9.2"
